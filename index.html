<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISP Register</title>
<meta name="description" content="ISP Register - Daily Hisab Management System">
<meta name="theme-color" content="#00452E">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="lock-screen" id="lock-screen">
  <div class="lock-box">
    <div class="lock-avatar"><div class="logo" id="lk-logo"></div></div>
    <div class="sub">Secure Access</div>
    <h2>ISP Register</h2>
    <p>Jaari rakhne ke liye password daalein</p>
    <input type="password" id="lock-pass" placeholder="Password" autofocus>
    <button onclick="checkPassword()">Unlock</button>
    <div class="lock-err" id="lock-err"></div>
    <div class="lock-foot">🔒 Encrypted Local Access</div>
  </div>
</div>

<div id="app-content" style="display:none">
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo" id="lg"></div>ISP Register</div>
    <div id="nav"></div>
    <div class="promo"><small>Remaining Balance</small><b id="s-pro-side">Rs 0</b><button onclick="saveFile()">💾 Save Backup</button></div>
  </aside>
  <div class="ov" id="ov" onclick="tgl()"></div>
  <main class="main">
    <div class="top">
      <button class="ib" id="burger" onclick="tgl()"></button>
      <div><h1 id="ttl">Dashboard</h1><div class="dt" id="dt"></div></div>
      <div class="sp"></div>
      <button class="ib" title="Save" onclick="saveFile()" id="b-save"></button>
      <button class="ib" title="Load" onclick="$('file-in').click()" id="b-load"></button>
      <button class="ib" title="Print" onclick="window.print()" id="b-print"></button>
      <button class="ib red" title="Logout" onclick="logout()" id="b-out"></button>
      <div class="me"><div class="logo" id="me-img" style="width:38px;height:38px;border-radius:50%"></div><div><b>Admin</b><span>Rehan</span></div></div>
      <input type="file" id="file-in" accept=".json" style="display:none" onchange="loadFile(this)">
    </div>
    <div id="pages"></div>
  </main>
</div>
</div>
<datalist id="cust-list"></datalist><datalist id="worker-list"></datalist>
<div id="modal"><div class="mb"><h3 id="mt">Edit</h3><div class="fields" id="mf"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="saveEdit()">Save Changes</button></div></div></div>
<div id="tip"></div>

<script src="js/app.js"></script>
</body>
</html>
